# MCP Gateway - Example Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Copy this file to config.yaml and adjust to match your setup.
# Environment variables are supported: ${VAR_NAME:-default_value}
# ═══════════════════════════════════════════════════════════════════════════════

gateway:
  host: "0.0.0.0"
  port: 8080
  log_level: "info"
  tool_cache_ttl: 300              # Re-discover tools every 5 minutes
  lazy_schema_loading: true        # Only fetch schemas when tools are called

  # ─── Authentication ────────────────────────────────────────────────────
  # When set, all API/MCP requests require this key (except /health, /, /static)
  # Clients send it as: X-API-Key header, Authorization: Bearer header, or ?api_key= param
  # api_key: "${MCP_GATEWAY_API_KEY}"

  # ─── Gateway Mode ─────────────────────────────────────────────────────
  # "proxy" - Expose all upstream tools directly to the AI harness (default)
  # "meta"  - Expose only 3 meta-tools (discover, describe, execute)
  #           The LLM uses discover to find tools, describe to get schemas,
  #           and execute to call them. ~92% token savings vs proxy mode.
  mode: "meta"

  # ─── Persistence ──────────────────────────────────────────────────────
  state_file: "state.json"         # Backends added via API are saved here

  # ─── Auto-Reconnect ───────────────────────────────────────────────────
  auto_reconnect: true             # Retry disconnected backends automatically
  reconnect_interval: 30           # Base interval in seconds (exponential backoff applies)

backends:
  # ─── NCM MCP Servers (Streamable HTTP, stateless 2026-07-28) ──────────
  # These servers support both MCP 2026-07-28 (stateless) and legacy protocols.
  # The gateway auto-detects the protocol era on connect — no config needed.
  # Set protocol_version: "2026-07-28" to force stateless (skip auto-detection).

  - name: ncm-fleet
    url: "http://localhost:3001/mcp"
    transport: "http"
    description: "Fleet management - routers, groups, accounts, locations, configurations, firmware"
    lazy: true
    # protocol_version: "auto"     # Default: auto-detects 2026-07-28 from ncm_mcp_servers
    # headers:
    #   Authorization: "Bearer ${FLEET_TOKEN}"
    # tools:
    #   include: ["get_routers", "get_groups", "get_accounts"]

  - name: ncm-monitoring
    url: "http://localhost:3002/mcp"
    transport: "http"
    description: "Monitoring - net devices, health metrics, alerts, speed tests"
    lazy: true

  - name: ncm-cloud-services
    url: "http://localhost:3003/mcp"
    transport: "http"
    description: "Cloud services - users, subscriptions, private cellular, exchange"
    lazy: true
    # tools:
    #   exclude: ["manage_network", "manage_radio"]

  # ─── Puppeteer (Stdio subprocess) ─────────────────────────────────────
  # Browser automation spawned as a child process. Communicates over stdin/stdout.
  # Requires npx (Node.js) on the PATH.

  - name: puppeteer
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-puppeteer"]
    description: "Browser automation - screenshots, navigation, clicks, form filling"
    lazy: true
